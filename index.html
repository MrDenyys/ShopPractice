<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <section class="main-navigation">
        <div class="main-container">
            <div class="main-div">
                <div class="second-main-div" data-secondMain="">
                    <img src="/pngs/shopingCart.webp" alt="" width="42px" height="30px">
                    <button data-button="">CART</button>
                    <p data-count="">0</p>
                </div>
                <button data-Add="">ADD</button>
            </div>
        </div>
        <div class="div-input">
            <input type="search" name="" id="" placeholder="search anything">
        </div>

              <div class="third-main-div">
                    <button data-info="" onclick="">!INFO!</button>
                </div>
        </section>
        <section class="categories">
            <button>Categories</button>
        </section>
    </header>
    <main>
        <section class="goods" data-goods="">
            <div data-div_goods class="div-goods">
                <img src="/pngs/bread.webp" alt="" >
                <p>Bread</p>
                <p data-price="100">100</p>
                <button data-addCart="">Add to cart</button>
            </div>
              <div data-div_goods class="div-goods">
                <img src="/pngs/milk.png" alt="" width="250px" height="250px">
                <p>Milk</p>
                <p data-price="230">230</p>
                <button data-addCart="">add to cart</button>
            </div>
            <div data-div_goods class="div-goods">
                <img src="/pngs/cottage.png" alt="" >
                <p>Cottage cheese</p>
                <p data-price="200">200</p>
                <button data-addCart="">Add to cart</button>
            </div>
             <div data-div_goods class="div-goods">
                <img src="/pngs/peaches-png-transparent-image-6.png" alt="" >
                <p>peach</p>
                <p data-price="350">350</p>
                <button data-addCart="">Add to cart</button>
            </div>
        </section>
    </main>
</body>
</html>
